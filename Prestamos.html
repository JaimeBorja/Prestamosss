<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#10243a"><meta name="description" content="Gestión de clientes, préstamos y cobranzas"><title>Mi Sistema Financiero</title>
<style>
:root{--navy:#10243a;--blue:#1d4265;--green:#16845b;--bg:#f3f6fa;--ink:#172536;--muted:#66778a;--line:#e2e8ef;--red:#b83232;--amber:#a66a0b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.login{min-height:100dvh;display:grid;place-items:center;padding:20px;background:linear-gradient(145deg,#10243a,#1d4265)}.login-card{width:min(420px,100%);background:white;border-radius:20px;padding:28px;box-shadow:0 18px 60px #0003}.brand{font-weight:800;font-size:22px;color:var(--navy)}.sub{color:var(--muted);font-size:13px;margin:7px 0 22px}.field{display:flex;flex-direction:column;gap:6px;margin:12px 0}.field label{font-size:13px;font-weight:650;color:#425369}.field input,.field select,.field textarea{border:1px solid #d4dde7;border-radius:10px;padding:11px 12px;background:#fff;color:var(--ink);width:100%;min-width:0}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:700;background:var(--navy);color:#fff}.btn.green{background:var(--green)}.btn.light{background:#eaf0f6;color:var(--navy)}.btn.danger{background:#fff0f0;color:var(--red)}.btn.small{padding:7px 10px;font-size:12px}.full{width:100%}.app{min-height:100dvh}.topbar{background:var(--navy);color:#fff;padding:13px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;z-index:5}.topbar strong{font-size:17px}.topbar small{opacity:.75}.layout{display:grid;grid-template-columns:225px 1fr;max-width:1500px;margin:auto;min-height:calc(100dvh - 52px)}aside{background:#fff;border-right:1px solid var(--line);padding:18px 12px}.nav{display:flex;flex-direction:column;gap:5px}.nav button{text-align:left;border:0;background:transparent;padding:12px;border-radius:9px;color:#41536a;font-weight:650}.nav button.active,.nav button:hover{background:#eaf1f7;color:var(--navy)}main{padding:22px;min-width:0}.pagehead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}.pagehead h1{font-size:24px;margin:0;color:var(--navy)}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}.stat,.panel{background:white;border:1px solid var(--line);border-radius:14px;padding:16px}.stat .label{color:var(--muted);font-size:12px}.stat .value{font-size:22px;font-weight:800;margin-top:8px;color:var(--navy);overflow-wrap:anywhere}.panel{margin-top:16px}.panel h2{font-size:17px;margin:0 0 12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:650px}th,td{text-align:left;padding:11px 9px;border-bottom:1px solid var(--line);font-size:13px}th{color:var(--muted);font-weight:700;background:#f8fafc}.pill{display:inline-block;padding:4px 8px;border-radius:20px;font-size:11px;font-weight:700;background:#e9f5ef;color:var(--green)}.pill.red{background:#fff0f0;color:var(--red)}.pill.amber{background:#fff5df;color:var(--amber)}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}.notice{background:#fff8e8;border:1px solid #f1dfb6;color:#72521c;padding:12px;border-radius:10px;font-size:13px;margin:12px 0}.modal{position:fixed;inset:0;background:#07152599;display:grid;place-items:center;padding:16px;z-index:10}.modalbox{background:#fff;border-radius:16px;padding:20px;width:min(620px,100%);max-height:90dvh;overflow:auto}.modalhead{display:flex;justify-content:space-between;align-items:center}.modalhead h2{margin:0;color:var(--navy)}.mobilebar{display:none}.empty{padding:22px;text-align:center;color:var(--muted)}.foot{font-size:11px;color:var(--muted);margin-top:18px;line-height:1.5}
@media(max-width:850px){.layout{display:block}aside{display:none}main{padding:15px 13px 90px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.stat{padding:13px}.stat .value{font-size:18px}.pagehead h1{font-size:21px}.mobilebar{display:flex;position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid var(--line);z-index:6;justify-content:space-around;padding:7px 3px calc(7px + env(safe-area-inset-bottom))}.mobilebar button{border:0;background:transparent;color:#52657a;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px}.mobilebar button.active{color:var(--green);font-weight:800}.mobilebar span{font-size:19px}.formgrid{grid-template-columns:1fr}.topbar{padding:12px}.topbar small{display:none}}
</style></head><body>
<div id="login" class="login"><div class="login-card"><div class="brand">◈ Mi Sistema Financiero</div><div class="sub">Gestión de clientes, préstamos y cobranzas</div><form id="loginForm"><div class="field"><label>Usuario</label><input id="username" autocomplete="username" required value="admin"></div><div class="field"><label>Contraseña</label><div style="display:flex;gap:8px;align-items:center"><input id="password" type="password" autocomplete="current-password" required style="flex:1"><button class="btn light" type="button" id="togglePassword" aria-label="Mostrar contraseña">Mostrar</button></div></div><button class="btn full" type="submit">Ingresar</button></form><div id="loginError" class="notice hidden">Usuario o contraseña incorrectos.</div><p class="foot">Primera apertura de demostración: usuario <b>admin</b> y contraseña <b>admin</b>. Cambiá la contraseña desde Configuración.</p></div></div>
<div id="app" class="app hidden"><header class="topbar"><div><strong>◈ Mi Sistema Financiero</strong><br><small>Administración de préstamos</small></div><div class="actions"><small id="userLabel"></small><button class="btn small light" onclick="logout()">Salir</button></div></header><div class="layout"><aside><nav class="nav" id="sideNav"></nav></aside><main id="main"></main></div><nav class="mobilebar" id="mobileNav"></nav></div>
<div id="modal" class="modal hidden" onclick="if(event.target===this)closeModal()"><div class="modalbox"><div class="modalhead"><h2 id="modalTitle"></h2><button class="btn small light" onclick="closeModal()">Cerrar</button></div><div id="modalBody"></div></div></div>
<script>
const KEY='msf_data_v1', AUTH='msf_auth_v1';let data,view='dashboard',currentUser='admin';
const seed=()=>({users:[{username:'admin',password:'admin',role:'principal',active:true}],clients:[],loans:[],payments:[],expenses:[],settings:{rate:10,period:'mensual',business:'Mi Sistema Financiero'},activity:[]});
let storageOK=true;function safeGet(store,key){try{return store.getItem(key)}catch(err){storageOK=false;return null}}function safeSet(store,key,value){try{store.setItem(key,value)}catch(err){storageOK=false}}function safeRemove(store,key){try{store.removeItem(key)}catch(err){storageOK=false}}function load(){try{data=JSON.parse(safeGet(localStorage,KEY))||seed()}catch{data=seed()}save()};function save(){safeSet(localStorage,KEY,JSON.stringify(data))}function money(n){return new Intl.NumberFormat('es-PY',{style:'currency',currency:'PYG',maximumFractionDigits:0}).format(Number(n)||0)}function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function date(s){return s?new Date(s+'T12:00:00').toLocaleDateString('es-PY'):'—'}function today(){return new Date().toISOString().slice(0,10)}function log(action){data.activity.unshift({user:currentUser,action,at:new Date().toISOString()});save()}
function login(e){e.preventDefault();document.getElementById('loginError').classList.add('hidden');let u=data.users.find(x=>x.username===document.getElementById('username').value.trim()&&x.password===document.getElementById('password').value&&x.active);if(!u){document.getElementById('loginError').classList.remove('hidden');return}currentUser=u.username;safeSet(sessionStorage,AUTH,currentUser);start()}
function start(){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('userLabel').textContent='Usuario: '+currentUser;render()}
function logout(){safeRemove(sessionStorage,AUTH);document.getElementById('app').classList.add('hidden');document.getElementById('login').classList.remove('hidden')}
const navs=[['dashboard','▦','Resumen'],['clients','♙','Clientes'],['loans','▤','Préstamos'],['payments','＄','Pagos'],['cash','▣','Caja'],['reports','▥','Informes'],['settings','⚙','Configuración']];function nav(){let html=navs.map(([id,ic,n])=>`<button class="${view===id?'active':''}" onclick="go('${id}')">${ic} &nbsp;${n}</button>`).join('');document.getElementById('sideNav').innerHTML=html;document.getElementById('mobileNav').innerHTML=navs.filter(x=>['dashboard','clients','loans','payments','settings'].includes(x[0])).map(([id,ic,n])=>`<button class="${view===id?'active':''}" onclick="go('${id}')"><span>${ic}</span>${n}</button>`).join('')}
function go(v){view=v;render()}function render(){nav();let m=document.getElementById('main');({dashboard:dashboard,clients:clientsPage,loans:loansPage,payments:paymentsPage,cash:cashPage,reports:reportsPage,settings:settingsPage}[view]||dashboard)(m)}
function pagehead(title,desc,button=''){return `<div class="pagehead"><div><h1>${title}</h1><div class="muted" style="font-size:13px;margin-top:4px">${desc}</div></div>${button}</div>`}
function stats(label,value){return `<div class="stat"><div class="label">${label}</div><div class="value">${value}</div></div>`}
function activeLoans(){return data.loans.filter(l=>l.status==='Activo')};function outstanding(l){return Math.max(0,Number(l.total||0)-data.payments.filter(p=>p.loanId===l.id).reduce((s,p)=>s+Number(p.amount),0))}
function dashboard(m){let capital=activeLoans().reduce((s,l)=>s+Number(l.capital),0),paidInterest=data.payments.reduce((s,p)=>s+Number(p.interest||0),0),pending=data.loans.reduce((s,l)=>s+outstanding(l),0),late=activeLoans().filter(l=>l.due<today()&&outstanding(l)>0).length;let todayPayments=data.payments.filter(p=>p.date===today()).reduce((s,p)=>s+Number(p.amount),0);m.innerHTML=pagehead('Resumen','Vista general de tu cartera financiera',`<button class="btn green" onclick="loanForm()">＋ Nuevo préstamo</button>`)+`<div class="grid">${stats('Capital prestado',money(capital))}${stats('Intereses cobrados',money(paidInterest))}${stats('Saldo pendiente',money(pending))}${stats('Préstamos activos',activeLoans().length)}${stats('Clientes registrados',data.clients.length)}${stats('Clientes atrasados',late)}${stats('Cobros de hoy',money(todayPayments))}${stats('Gastos registrados',money(data.expenses.reduce((s,x)=>s+Number(x.amount),0)))}</div><div class="panel"><h2>Próximos vencimientos</h2>${dueTable()}</div><div class="notice">Versión inicial: los datos se guardan en este navegador. Para sincronizar iPhone y Windows hace falta conectar una base de datos en la nube y publicar la aplicación.</div>`}
function dueTable(){let ls=activeLoans().filter(l=>outstanding(l)>0).sort((a,b)=>a.due.localeCompare(b.due)).slice(0,8);if(!ls.length)return '<div class="empty">No hay préstamos pendientes.</div>';return `<div class="tablewrap"><table><thead><tr><th>Cliente</th><th>Vencimiento</th><th>Saldo</th><th>Estado</th></tr></thead><tbody>${ls.map(l=>`<tr><td>${esc(clientName(l.clientId))}</td><td>${date(l.due)}</td><td>${money(outstanding(l))}</td><td><span class="pill ${l.due<today()?'red':'amber'}">${l.due<today()?'Atrasado':'Pendiente'}</span></td></tr>`).join('')}</tbody></table></div>`}
function clientName(id){return data.clients.find(c=>c.id===id)?.name||'Cliente eliminado'}
function clientsPage(m){m.innerHTML=pagehead('Clientes','Registro y datos de tus clientes',`<button class="btn green" onclick="clientForm()">＋ Nuevo cliente</button>`)+`<div class="panel"><div class="field"><label>Buscar cliente</label><input id="clientSearch" placeholder="Nombre, cédula o teléfono" oninput="filterClients()"></div><div id="clientTable">${clientTable(data.clients)}</div></div>`}
function clientTable(list){if(!list.length)return '<div class="empty">Todavía no hay clientes registrados.</div>';return `<div class="tablewrap"><table><thead><tr><th>Nombre</th><th>Cédula</th><th>Teléfono</th><th>Correo</th><th></th></tr></thead><tbody>${list.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.doc||'—')}</td><td>${esc(c.phone||'—')}</td><td>${esc(c.email||'—')}</td><td><button class="btn small light" onclick="clientDetail('${c.id}')">Ver</button></td></tr>`).join('')}</tbody></table></div>`}
function filterClients(){let q=document.getElementById('clientSearch').value.toLowerCase();document.getElementById('clientTable').innerHTML=clientTable(data.clients.filter(c=>[c.name,c.doc,c.phone].join(' ').toLowerCase().includes(q)))}
function openModal(title,html){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=html;document.getElementById('modal').classList.remove('hidden')}function closeModal(){document.getElementById('modal').classList.add('hidden')}
function clientForm(){openModal('Nuevo cliente',`<form onsubmit="saveClient(event)"><div class="formgrid">${field('Nombre y apellido','name',true)}${field('Cédula','doc')}${field('Teléfono / WhatsApp','phone')}${field('Correo electrónico','email','', 'email')}${field('Dirección','address')}${field('Ciudad','city')}${field('Referencias','refs')}${field('Observaciones','notes')}</div><button class="btn green full">Guardar cliente</button></form>`)}
function field(label,name,required=false,type='text',value=''){return `<div class="field"><label>${label}</label><input name="${name}" type="${type}" value="${esc(value)}" ${required===true?'required':''}></div>`}
function saveClient(e){e.preventDefault();let f=Object.fromEntries(new FormData(e.target));if(data.clients.some(c=>c.doc&&c.doc===f.doc)){alert('Ya existe un cliente con esa cédula.');return}data.clients.push({id:uid(),...f,created:today()});log('Registró cliente '+f.name);closeModal();render()}
function clientDetail(id){let c=data.clients.find(x=>x.id===id);let loans=data.loans.filter(l=>l.clientId===id);openModal(c.name,`<p><b>Cédula:</b> ${esc(c.doc||'—')}<br><b>Teléfono:</b> ${esc(c.phone||'—')}<br><b>Correo:</b> ${esc(c.email||'—')}<br><b>Dirección:</b> ${esc(c.address||'—')}</p><h3>Préstamos</h3>${loans.length?loans.map(l=>`<div class="panel"><p><b>Préstamo ${esc(l.code)}</b><br>Capital: ${money(l.capital)} · Saldo: <b>${money(outstanding(l))}</b></p><button class="btn small light" onclick="downloadDebtImage('${l.id}')">Crear imagen de deuda y saldo</button></div>`).join(''):'<p>Sin préstamos.</p>'}<div class="actions"><button class="btn green" onclick="closeModal();loanForm('${id}')">Nuevo préstamo</button>${c.email?`<button class="btn light" onclick="emailReminder('${id}')">Preparar correo</button>`:''}</div>`)}
function loansPage(m){m.innerHTML=pagehead('Préstamos','Operaciones, intereses y vencimientos',`<button class="btn green" onclick="loanForm()">＋ Nuevo préstamo</button>`)+`<div class="panel">${data.loans.length?`<div class="tablewrap"><table><thead><tr><th>N°</th><th>Cliente</th><th>Capital</th><th>Tasa</th><th>Total pactado</th><th>Saldo</th><th>Vencimiento</th><th>Estado</th><th></th></tr></thead><tbody>${data.loans.map(l=>`<tr><td>${esc(l.code)}</td><td>${esc(clientName(l.clientId))}</td><td>${money(l.capital)}</td><td>${l.rate}% ${esc(l.period)}</td><td>${money(l.total)}</td><td>${money(outstanding(l))}</td><td>${date(l.due)}</td><td><span class="pill ${outstanding(l)<=0?'':'amber'}">${outstanding(l)<=0?'Cancelado':l.status}</span></td><td><div class="actions"><button class="btn small light" onclick="paymentForm('${l.id}')">Cobrar</button><button class="btn small light" onclick="downloadDebtImage('${l.id}')">Imagen</button></div></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Todavía no hay préstamos registrados.</div>'}</div>`}
function loanForm(clientId=''){if(!data.clients.length){alert('Primero registrá un cliente.');go('clients');return}openModal('Registrar préstamo',`<form onsubmit="saveLoan(event)"><div class="formgrid"><div class="field"><label>Cliente</label><select name="clientId" required>${data.clients.map(c=>`<option value="${c.id}" ${c.id===clientId?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div>${field('Capital (Gs.)','capital',true,'number')}${field('Tasa de interés (%)','rate',true,'number',data.settings.rate)}<div class="field"><label>Período</label><select name="period"><option>diario</option><option>semanal</option><option>quincenal</option><option selected>mensual</option><option>anual</option></select></div><div class="field"><label>Modalidad</label><select name="mode"><option value="interest">Intereses solamente</option><option value="simple">Capital + intereses (interés simple)</option></select></div>${field('Fecha de entrega','start',true,'date',today())}${field('Fecha de vencimiento','due',true,'date',today())}</div><div class="notice">Cálculo inicial simple. Verificá el importe y las condiciones antes de guardar.</div><div id="loanPreview" class="panel"></div><button type="button" class="btn light full" onclick="previewLoan()">Calcular préstamo</button><br><br><button class="btn green full">Guardar préstamo</button></form>`);document.querySelector('[name=capital]').addEventListener('input',previewLoan);document.querySelector('[name=rate]').addEventListener('input',previewLoan)}
function calcLoan(f){let cap=Number(f.capital),rate=Number(f.rate),period=f.period,months=1;if(period==='diario')months=1/30;else if(period==='semanal')months=7/30;else if(period==='quincenal')months=.5;else if(period==='anual')months=12;let interest=cap*rate/100*months;return {interest,total:f.mode==='interest'?cap+interest:cap+interest,cap,rate,months}}
function previewLoan(){let form=document.querySelector('#modal form');if(!form)return;let f=Object.fromEntries(new FormData(form));let c=calcLoan(f);document.getElementById('loanPreview').innerHTML=`<b>Interés estimado:</b> ${money(c.interest)}<br><b>Total pactado:</b> ${money(c.total)}<br><small class="muted">La modalidad "intereses solamente" significa que en este vencimiento se cobra el interés y el capital permanece pendiente.</small>`}
function saveLoan(e){e.preventDefault();let f=Object.fromEntries(new FormData(e.target));let c=calcLoan(f);if(c.cap<=0||c.rate<0||!f.due||f.due<f.start){alert('Revisá capital, tasa y fechas.');return}let l={id:uid(),code:'PRE-'+String(data.loans.length+1).padStart(4,'0'),...f,capital:c.cap,interest:c.interest,total:c.total,status:'Activo',created:today()};data.loans.push(l);log('Creó préstamo '+l.code);closeModal();render()}
function paymentsPage(m){m.innerHTML=pagehead('Pagos','Registro de cobranzas',`<button class="btn green" onclick="paymentForm()">＋ Registrar pago</button>`)+`<div class="panel">${data.payments.length?`<div class="tablewrap"><table><thead><tr><th>Fecha</th><th>Cliente</th><th>Préstamo</th><th>Importe</th><th>Capital</th><th>Interés</th><th>Concepto</th></tr></thead><tbody>${data.payments.slice().reverse().map(p=>{let l=data.loans.find(x=>x.id===p.loanId);return `<tr><td>${date(p.date)}</td><td>${esc(clientName(l?.clientId))}</td><td>${esc(l?.code||'—')}</td><td>${money(p.amount)}</td><td>${money(p.capital)}</td><td>${money(p.interest)}</td><td>${esc(p.note||'Pago')}</td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">Todavía no hay pagos.</div>'}</div>`}
function paymentForm(loanId=''){let ls=data.loans.filter(l=>outstanding(l)>0);if(!ls.length){alert('No hay préstamos con saldo pendiente.');return}openModal('Registrar pago',`<form onsubmit="savePayment(event)"><div class="field"><label>Préstamo</label><select name="loanId" id="payLoan" onchange="updatePayBalance()">${ls.map(l=>`<option value="${l.id}" ${l.id===loanId?'selected':''}>${l.code} · ${esc(clientName(l.clientId))} · Saldo ${money(outstanding(l))}</option>`).join('')}</select></div><div id="payBalance" class="notice"></div><div class="formgrid">${field('Importe recibido (Gs.)','amount',true,'number')}${field('Fecha de pago','date',true,'date',today())}<div class="field"><label>Aplicación</label><select name="apply"><option value="interest">Intereses</option><option value="capital">Capital</option><option value="both" selected>Capital e intereses</option></select></div>${field('Observación','note')}</div><button class="btn green full">Guardar pago</button></form>`);updatePayBalance()}
function updatePayBalance(){let id=document.getElementById('payLoan')?.value,l=data.loans.find(x=>x.id===id);if(l)document.getElementById('payBalance').textContent='Saldo pendiente: '+money(outstanding(l))}
function savePayment(e){e.preventDefault();let f=Object.fromEntries(new FormData(e.target)),l=data.loans.find(x=>x.id===f.loanId),amount=Number(f.amount);if(!l||amount<=0||amount>outstanding(l)){alert('El importe debe ser mayor que cero y no superar el saldo pendiente.');return}let interest=Math.min(amount,Number(l.interest||0)),capital=amount-interest;if(f.apply==='capital'){capital=amount;interest=0}else if(f.apply==='interest'){capital=0;interest=amount}data.payments.push({id:uid(),...f,amount,capital,interest});if(outstanding(l)-amount<=0)l.status='Cancelado';log('Registró pago de '+money(amount)+' para '+l.code);closeModal();render()}
function cashPage(m){let income=data.payments.reduce((s,p)=>s+p.amount,0),loansOut=data.loans.reduce((s,l)=>s+Number(l.capital),0),expenses=data.expenses.reduce((s,x)=>s+x.amount,0);m.innerHTML=pagehead('Caja','Control básico de entradas y salidas',`<button class="btn green" onclick="expenseForm()">＋ Registrar egreso</button>`)+`<div class="grid">${stats('Cobros registrados',money(income))}${stats('Capital entregado',money(loansOut))}${stats('Egresos',money(expenses))}${stats('Flujo neto registrado',money(income-expenses-loansOut))}</div><div class="panel"><h2>Registrar movimiento</h2><p class="muted">Los préstamos entregados y pagos recibidos se reflejan automáticamente. Registrá aquí otros gastos.</p></div><div class="panel"><h2>Gastos</h2>${data.expenses.length?data.expenses.map(x=>`<p>${date(x.date)} · ${esc(x.description)} · <b>${money(x.amount)}</b></p>`).join(''):'<div class="empty">Sin egresos registrados.</div>'}</div>`}
function expenseForm(){openModal('Registrar egreso',`<form onsubmit="saveExpense(event)">${field('Descripción','description',true)}${field('Importe (Gs.)','amount',true,'number')}${field('Fecha','date',true,'date',today())}<button class="btn green full">Guardar egreso</button></form>`)}function saveExpense(e){e.preventDefault();let f=Object.fromEntries(new FormData(e.target));f.amount=Number(f.amount);if(f.amount<=0)return;data.expenses.push({id:uid(),...f});log('Registró egreso '+money(f.amount));closeModal();render()}
function reportsPage(m){let interest=data.payments.reduce((s,p)=>s+p.interest,0),capital=data.payments.reduce((s,p)=>s+p.capital,0);m.innerHTML=pagehead('Informes','Resumen de movimientos y exportación')+`<div class="grid">${stats('Capital cobrado',money(capital))}${stats('Intereses cobrados',money(interest))}${stats('Total cobrado',money(capital+interest))}${stats('Préstamos',data.loans.length)}</div><div class="panel"><h2>Exportar información</h2><div class="actions"><button class="btn light" onclick="exportCSV('clients')">Clientes CSV</button><button class="btn light" onclick="exportCSV('loans')">Préstamos CSV</button><button class="btn light" onclick="exportCSV('payments')">Pagos CSV</button><button class="btn light" onclick="backup()">Descargar respaldo completo (JSON)</button><button class="btn light" onclick="window.print()">Imprimir / PDF</button></div></div><div class="panel"><h2>Respaldo y recuperación de datos</h2><p class="muted">Descargá una copia completa de tus clientes, préstamos, pagos, caja, usuarios y configuración. Para recuperar la información, seleccioná un archivo JSON de respaldo creado por este sistema.</p><div class="actions"><button class="btn green" onclick="backup()">Descargar respaldo</button><label class="btn light" for="backupFile">Cargar respaldo JSON</label><input id="backupFile" type="file" accept=".json,application/json" style="display:none" onchange="restoreBackup(event)"></div><div class="notice">Al cargar un respaldo, los datos actuales serán reemplazados por los del archivo seleccionado. Se recomienda descargar primero una copia de seguridad.</div></div>`}
function exportCSV(type){let rows=data[type]||[];if(!rows.length){alert('No hay datos para exportar.');return}let keys=Object.keys(rows[0]),csv=[keys.join(';'),...rows.map(r=>keys.map(k=>'"'+String(r[k]??'').replaceAll('"','""')+'"').join(';'))].join('\n');download(csv,type+'.csv','text/csv;charset=utf-8')}
function backup(){download(JSON.stringify(data,null,2),'respaldo-mi-sistema-financiero.json','application/json')}function download(content,name,type){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([content],{type}));a.href=u;a.download=name;a.click();URL.revokeObjectURL(u)}
function restoreBackup(e){
 const file=e.target.files&&e.target.files[0];if(!file)return;
 const reader=new FileReader();
 reader.onload=()=>{
  try{
   const restored=JSON.parse(reader.result);
   const valid=restored&&Array.isArray(restored.users)&&Array.isArray(restored.clients)&&Array.isArray(restored.loans)&&Array.isArray(restored.payments)&&Array.isArray(restored.expenses)&&restored.settings&&typeof restored.settings==='object';
   if(!valid)throw new Error('Formato no válido');
   if(!confirm('¿Seguro que querés cargar este respaldo? Se reemplazarán todos los datos actuales.'))return;
   data={...seed(),...restored,users:restored.users,clients:restored.clients,loans:restored.loans,payments:restored.payments,expenses:restored.expenses,settings:{...seed().settings,...restored.settings},activity:Array.isArray(restored.activity)?restored.activity:[]};
   save();log('Restauró datos desde un respaldo JSON');alert('Respaldo cargado correctamente.');go('dashboard');
  }catch(err){alert('No se pudo cargar el respaldo. Verificá que sea un archivo JSON válido generado por este sistema.');}
  finally{e.target.value='';}
 };
 reader.onerror=()=>{alert('No se pudo leer el archivo.');e.target.value='';};
 reader.readAsText(file);
}
function downloadDebtImage(loanId){
 const l=data.loans.find(x=>x.id===loanId);if(!l){alert('No se encontró el préstamo.');return}
 const c=data.clients.find(x=>x.id===l.clientId),paid=data.payments.filter(p=>p.loanId===l.id).reduce((s,p)=>s+Number(p.amount||0),0),balance=outstanding(l);
 const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');canvas.width=1200;canvas.height=850;
 ctx.fillStyle='#f3f6fa';ctx.fillRect(0,0,1200,850);
 ctx.fillStyle='#10243a';ctx.fillRect(0,0,1200,190);
 ctx.fillStyle='#ffffff';ctx.font='bold 46px Arial';ctx.fillText(data.settings.business||'Mi Sistema Financiero',70,85);
 ctx.font='26px Arial';ctx.fillStyle='#dce8f3';ctx.fillText('RESUMEN DE DEUDA Y SALDO',70,140);
 ctx.fillStyle='#ffffff';roundRect(ctx,65,225,1070,555,24);ctx.fill();
 ctx.fillStyle='#66778a';ctx.font='bold 22px Arial';ctx.fillText('CLIENTE',105,290);
 ctx.fillStyle='#172536';ctx.font='bold 38px Arial';ctx.fillText(fitText(ctx,c?.name||'Cliente eliminado',950),105,340);
 const rows=[['N° DE PRÉSTAMO',l.code||'—'],['CAPITAL ENTREGADO',money(l.capital)],['TOTAL PACTADO',money(l.total)],['TOTAL ABONADO',money(paid)],['FECHA DE VENCIMIENTO',date(l.due)]];
 let y=415;rows.forEach(([label,value])=>{ctx.fillStyle='#66778a';ctx.font='bold 19px Arial';ctx.fillText(label,110,y);ctx.fillStyle='#172536';ctx.font='bold 25px Arial';ctx.fillText(fitText(ctx,String(value),550),560,y);y+=65});
 ctx.fillStyle='#eaf1f7';roundRect(ctx,90,690,1020,65,14);ctx.fill();
 ctx.fillStyle='#10243a';ctx.font='bold 22px Arial';ctx.fillText('SALDO PENDIENTE',120,733);
 ctx.fillStyle=balance>0?'#b83232':'#16845b';ctx.font='bold 34px Arial';ctx.textAlign='right';ctx.fillText(money(balance),1070,738);ctx.textAlign='left';
 ctx.fillStyle='#66778a';ctx.font='16px Arial';ctx.fillText('Generado el '+new Date().toLocaleString('es-PY'),70,820);
 const a=document.createElement('a');a.href=canvas.toDataURL('image/png');a.download='deuda-'+String(l.code||loanId).replace(/[^a-z0-9_-]/gi,'_')+'.png';a.click();
}
function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function fitText(ctx,text,maxWidth){while(ctx.measureText(text).width>maxWidth&&text.length>4)text=text.slice(0,-4)+'...';return text}

function settingsPage(m){let admin=data.users.find(x=>x.username===currentUser);m.innerHTML=pagehead('Configuración','Datos del negocio, tasas y usuarios')+`<div class="panel"><h2>Datos y tasa predeterminada</h2><form onsubmit="saveSettings(event)">${field('Nombre del negocio','business',true,'text',data.settings.business)}${field('Tasa predeterminada (%)','rate',true,'number',data.settings.rate)}<button class="btn green">Guardar configuración</button></form></div><div class="panel"><h2>Cambiar contraseña</h2><form onsubmit="changePassword(event)">${field('Contraseña actual','old',true,'password')}${field('Nueva contraseña','next',true,'password')}<button class="btn">Actualizar contraseña</button></form></div><div class="panel"><h2>Administradores y usuarios</h2>${data.users.map(u=>`<p><b>${esc(u.username)}</b> · ${u.role} · ${u.active?'Activo':'Inactivo'}</p>`).join('')}<button class="btn light" onclick="userForm()">＋ Crear usuario</button></div><div class="notice">Aviso de seguridad: esta primera versión guarda los datos localmente en el navegador. El inicio de sesión es básico y no sustituye autenticación segura de servidor. No cargues documentos sensibles ni datos reales hasta conectar el backend protegido.</div>`}
function saveSettings(e){e.preventDefault();let f=Object.fromEntries(new FormData(e.target));data.settings.business=f.business;data.settings.rate=Number(f.rate);save();log('Actualizó configuración');alert('Configuración guardada.');render()}function changePassword(e){e.preventDefault();let f=Object.fromEntries(new FormData(e.target)),u=data.users.find(x=>x.username===currentUser);if(f.old!==u.password||f.next.length<8){alert('La contraseña actual no coincide o la nueva tiene menos de 8 caracteres.');return}u.password=f.next;save();log('Cambió contraseña');alert('Contraseña actualizada.');e.target.reset()}
function userForm(){if(currentUser!=='admin'){alert('Solo el administrador principal puede crear usuarios en esta versión.');return}openModal('Crear usuario',`<form onsubmit="saveUser(event)">${field('Nombre de usuario','username',true)}${field('Contraseña (mínimo 8 caracteres)','password',true,'password')}<div class="field"><label>Rol</label><select name="role"><option value="admin">Administrador</option><option value="cobrador">Cobrador</option></select></div><button class="btn green full">Crear usuario</button></form>`)}function saveUser(e){e.preventDefault();let f=Object.fromEntries(new FormData(e.target));if(f.password.length<8||data.users.some(u=>u.username===f.username)){alert('Contraseña corta o usuario ya existente.');return}data.users.push({...f,active:true});log('Creó usuario '+f.username);closeModal();render()}
function emailReminder(clientId){let c=data.clients.find(x=>x.id===clientId),l=data.loans.find(x=>x.clientId===clientId&&outstanding(x)>0);if(!c?.email){alert('El cliente no tiene correo registrado.');return}let body=`Hola ${c.name}, te recordamos que tenés un saldo pendiente de ${money(outstanding(l))} correspondiente a tu préstamo ${l.code}. Por favor, comunicate con nosotros para coordinar el pago.`;location.href=`mailto:${encodeURIComponent(c.email)}?subject=${encodeURIComponent('Recordatorio de pago')}&body=${encodeURIComponent(body)}`}
document.getElementById('loginForm').addEventListener('submit',login);document.getElementById('togglePassword').addEventListener('click',()=>{const p=document.getElementById('password'),b=document.getElementById('togglePassword');p.type=p.type==='password'?'text':'password';b.textContent=p.type==='password'?'Mostrar':'Ocultar'});load();let saved=safeGet(sessionStorage,AUTH);if(saved&&data.users.some(u=>u.username===saved&&u.active)){currentUser=saved;start()}if(!storageOK){const n=document.createElement('div');n.className='notice';n.textContent='Aviso: el navegador bloqueó el almacenamiento. Los datos podrían no conservarse al cerrar la página. Abrí esta aplicación desde un sitio HTTPS para un funcionamiento más estable.';document.querySelector('.login-card').appendChild(n)}
</script></body></html>
